name: Foundry

on:
  push:
    paths: ["v2/**", ".gitmodules", ".github/workflows/foundry.yml"]
  pull_request:
    paths: ["v2/**", ".gitmodules", ".github/workflows/foundry.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

jobs:
  # Fast checks, no network: format, build, offline tests.
  test:
    name: Build and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Offline tests
        run: forge test --no-match-contract Fork -vvv

  # Fork tests: run FlashArb against local copies of live Base and Arbitrum.
  # They use the public RPC links in foundry.toml, so a busy RPC can make them fail.
  fork:
    name: Fork tests (${{ matrix.chain }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        chain: [Base, Arbitrum]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fork tests
        run: forge test --match-contract FlashArbFork${{ matrix.chain }} -vv

  # Slither: Solidity code checker. Fails on medium or high findings.
  # Settings are in v2/slither.config.json. Low and informational findings are only shown.
  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Slither
        run: slither . --fail-medium

  # Coverage: runs all Foundry tests (fork tests included) and measures which
  # lines of the contracts they reach. The table is shown on the run's summary page.
  # The full report (HTML + lcov.info) is saved as the "coverage-report" download.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Coverage
        run: |
          forge coverage --report summary --report lcov --md > coverage.txt
          {
            echo "## Contract coverage"
            echo
            sed -n '/^| File/,/^| Total/p' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTML report
        run: |
          sudo apt-get install -y -qq lcov
          genhtml lcov.info --branch-coverage -o coverage-html

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            v2/lcov.info
            v2/coverage-html
