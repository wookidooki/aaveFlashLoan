name: Node

on:
  push:
    paths: ["v2/**", ".github/workflows/node.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/node.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

jobs:
  # Unit tests, no network. npm ci also compiles the contracts (postinstall).
  # The Hardhat fork tests (npm run test:fork) are not run here: they take ~4 min,
  # and the Foundry workflow already runs the same fork checks.
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # package.json needs Node >= 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install (also compiles contracts)
        run: npm ci

      - name: Unit tests
        run: npm test
